openapi: 3.0.3
info:
  title: 9Router V2 forwarding proxy
  version: 1.0.0
  description: Server-side facade over a hidden per-key OpenAI-compatible v1 upstream.
servers:
  - url: /
paths:
  /api/keys/{id}/v2-config:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read a key's hidden V2 forwarding configuration
      description: Admin-only response. The decrypted destination and credential are never included in generic key APIs and must not be cached.
      security:
        - dashboardSession: []
      responses:
        "200":
          description: Decrypted configuration for the authenticated administrator.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store, max-age=0
          content:
            application/json:
              schema:
                type: object
                required: [v2Proxy]
                properties:
                  v2Proxy:
                    $ref: "#/components/schemas/V2AdminConfig"
        "401":
          description: An authenticated dashboard administrator session is required.
        "404":
          description: API key not found.
    put:
      summary: Replace a key's V2 forwarding configuration
      description: Admin-only full replacement. The upstream API key is encrypted before persistence.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [v2Proxy]
              properties:
                v2Proxy:
                  $ref: "#/components/schemas/V2AdminConfigInput"
      responses:
        "200":
          description: Updated decrypted configuration for the authenticated administrator.
          content:
            application/json:
              schema:
                type: object
                required: [v2Proxy]
                properties:
                  v2Proxy:
                    $ref: "#/components/schemas/V2AdminConfig"
        "400":
          description: Invalid V2 forwarding configuration.
        "401":
          description: An authenticated dashboard administrator session is required.
        "404":
          description: API key not found.
  /v2/chat/completions:
    post:
      summary: Forward an OpenAI-compatible chat completion
      description: The facade credential selects a hidden upstream and is replaced before forwarding.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Upstream success with facade-owned response headers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/NumericError"
        "401":
          $ref: "#/components/responses/NumericError"
        "403":
          $ref: "#/components/responses/NumericError"
        "429":
          $ref: "#/components/responses/NumericError"
        "500":
          $ref: "#/components/responses/NumericError"
        "502":
          $ref: "#/components/responses/NumericError"
        "504":
          $ref: "#/components/responses/NumericError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 9Router API key
    dashboardSession:
      type: apiKey
      in: cookie
      name: auth_token
  schemas:
    V2AdminConfigInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        upstreamBaseUrl:
          type: string
          format: uri
          nullable: true
        upstreamApiKey:
          type: string
          nullable: true
          format: password
    V2AdminConfig:
      allOf:
        - $ref: "#/components/schemas/V2AdminConfigInput"
        - type: object
          required: [configured, credentialReadable]
          properties:
            configured:
              type: boolean
            credentialReadable:
              type: boolean
  responses:
    NumericError:
      description: Numeric-only error. No upstream details are returned.
      content:
        text/plain:
          schema:
            type: string
            pattern: "^[0-9]+$"
          examples:
            redacted:
              value: "2002"
